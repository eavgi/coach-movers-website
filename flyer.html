<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coach Movers — Office Door Sign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: 8.5in 11in; margin: 0; }

  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  html, body {
    margin: 0;
    padding: 0;
    background: #d8d8d8;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #1a1a1a;
  }

  .page {
    width: 8.5in;
    height: 11in;
    margin: 0 auto;
    background: #fff;
    overflow: hidden;
    position: relative;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
  }

  /* ---------- HEADER ---------- */
  .header {
    background: #111;
    padding: 0.55in 0.5in 0.45in;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  .header-photo {
    position: absolute;
    inset: 0;
    background: url('images/mover-shot-scaled.jpg') center 30% / cover no-repeat;
    opacity: 0.55;
    z-index: 0;
  }

  .header-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
        rgba(0,0,0,0.55) 0%,
        rgba(0,0,0,0.35) 45%,
        rgba(0,0,0,0.75) 100%);
    z-index: 1;
  }

  .header > * { position: relative; z-index: 2; }

  .header::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 0.18in;
    background: #C8F23C;
    z-index: 3;
  }

  .header-logo {
    width: 3.4in;
    height: auto;
    margin-bottom: 0.25in;
  }

  .welcome {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 64pt;
    line-height: 0.9;
    letter-spacing: 0.02em;
    color: #fff;
    text-transform: uppercase;
    margin: 0;
  }

  .welcome-sub {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 11pt;
    letter-spacing: 0.32em;
    color: #C8F23C;
    text-transform: uppercase;
    margin-top: 0.18in;
  }

  /* ---------- HOURS ---------- */
  .hours {
    padding: 0.55in 0.65in 0.4in;
    text-align: center;
    flex-shrink: 0;
  }

  .hours-label {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 11pt;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 0.18in;
  }

  .hours-days {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 32pt;
    color: #1a1a1a;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 0.12in;
    letter-spacing: 0.01em;
  }

  .hours-time {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 56pt;
    line-height: 1;
    color: #1a1a1a;
    letter-spacing: 0.005em;
  }

  .hours-underline {
    width: 1.6in;
    height: 6px;
    background: #C8F23C;
    margin: 0.32in auto 0;
  }

  /* ---------- INFO BLOCK ---------- */
  .info {
    padding: 0.1in 0.65in 0.4in;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .info-row {
    display: flex;
    align-items: center;
    gap: 0.3in;
    padding: 0.26in 0;
    border-bottom: 1px solid #ECECEC;
  }

  .info-row:last-child { border-bottom: none; }

  .info-label {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 9pt;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #999;
    width: 1.2in;
    flex-shrink: 0;
  }

  .info-value {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 16pt;
    color: #1a1a1a;
    line-height: 1.25;
    letter-spacing: 0.005em;
    flex: 1;
  }

  .info-value.phone {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 24pt;
    letter-spacing: 0.02em;
  }

  /* ---------- FOOTER ---------- */
  .footer {
    position: relative;
    flex-shrink: 0;
    background: #F3F3F3;
    padding: 0.32in 0.65in;
    display: flex;
    align-items: center;
    justify-content: space-between;
    overflow: hidden;
  }

  .footer-tagline {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 14pt;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #1a1a1a;
  }

  .footer-tagline span { color: #6e6e6e; font-weight: 400; }

  .footer-web {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 12pt;
    color: #1a1a1a;
    letter-spacing: 0.02em;
  }

  .footer-accent {
    position: absolute;
    right: 0;
    top: 0.18in;
    bottom: 0.18in;
    width: 0.07in;
    background: #C8F23C;
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header">
    <div class="header-photo"></div>
    <div class="header-overlay"></div>
    <img src="images/logo.png" class="header-logo" alt="Coach Movers">
    <h1 class="welcome">Welcome</h1>
    <div class="welcome-sub">Coach Movers Headquarters</div>
  </div>

  <!-- HOURS -->
  <div class="hours">
    <div class="hours-label">Office Hours</div>
    <div class="hours-days">Monday &ndash; Sunday</div>
    <div class="hours-time">7AM &ndash; 9PM</div>
    <div class="hours-underline"></div>
  </div>

  <!-- INFO -->
  <div class="info">
    <div class="info-row">
      <div class="info-label">Address</div>
      <div class="info-value">200 Broadhollow Rd, Suite 207<br>Melville, NY 11747</div>
    </div>
    <div class="info-row">
      <div class="info-label">Call</div>
      <div class="info-value phone">(800) 917-4446</div>
    </div>
    <div class="info-row">
      <div class="info-label">Email</div>
      <div class="info-value">contact@coachmovers.com</div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="footer-tagline">Moving Made <span>Easy.</span></div>
    <div class="footer-web">CoachMovers.com</div>
    <div class="footer-accent"></div>
  </div>

</div>
</body>
</html>
