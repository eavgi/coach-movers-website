<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coach Movers — Office Door Sign (11×14 Acrylic)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  @page { size: 14in 11in; margin: 0; }

  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  :root {
    --lime: #C8F23C;
    --ink: #ffffff;          /* "ink" is now white — design prints on dark surfaces */
    --ink-soft: rgba(255,255,255,0.6);
    --rule: rgba(255,255,255,0.2);
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #3a2818;     /* dark brown preview only — not in PNG export */
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
  }

  /* ==================== SIGN ==================== */
  .sign {
    width: 14in;
    height: 11in;
    margin: 0 auto;
    background: transparent;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* Inner keyline removed — would be a stray line on the wood */
  .sign::before { display: none; }

  /* Top + bottom white+lime stripes */
  .stripe-top, .stripe-bottom {
    position: absolute;
    left: 0; right: 0;
    height: 0.14in;
    background: var(--ink);
    z-index: 7;
  }
  .stripe-top { top: 0; }
  .stripe-bottom { bottom: 0; }

  .stripe-top::after, .stripe-bottom::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 0.05in;
    background: var(--lime);
  }
  .stripe-top::after { bottom: -0.07in; }
  .stripe-bottom::before { top: -0.07in; }

  /* ==================== TOP: EST PILL ==================== */
  .est-pill {
    position: absolute;
    top: 0.55in;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 11pt;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--ink);
    border: 1px solid var(--ink);
    padding: 0.09in 0.36in;
    line-height: 1;
    z-index: 5;
  }

  /* ==================== LOGO (center, large) ==================== */
  .logo-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.7in 0.4in 0.1in;
    position: relative;
    min-height: 0;
  }

  .logo {
    max-width: 8.4in;
    max-height: 8.4in;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* ==================== TAGLINE ==================== */
  .tagline {
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-style: italic;
    font-size: 22pt;
    color: var(--ink);
    letter-spacing: 0.005em;
    margin: 0 0 0.18in;
  }
  .tagline .accent { color: var(--lime); }

  .tagline-rule {
    width: 0.9in;
    height: 3px;
    background: var(--lime);
    margin: 0 auto 0.3in;
  }

  /* ==================== BOTTOM: CONTACT ROW ==================== */
  .contact {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.55in;
    padding: 0 0.6in 0.5in;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 0.22in;
  }

  .contact-icon {
    width: 0.5in;
    height: 0.5in;
    flex-shrink: 0;
    color: var(--ink);
  }

  .contact-label {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 8.5pt;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 0.05in;
  }

  .phone-value {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 40pt;
    line-height: 1;
    letter-spacing: -0.005em;
    color: var(--ink);
    margin: 0;
    white-space: nowrap;
  }
  .phone-value .area { color: var(--ink-soft); font-weight: 500; }

  .address-value {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 17pt;
    line-height: 1.25;
    letter-spacing: 0.02em;
    color: var(--ink);
    margin: 0;
  }
  .address-city {
    color: var(--ink-soft);
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  /* Subtle divider between phone and address */
  .contact-divider {
    width: 1px;
    height: 0.9in;
    background: var(--rule);
  }

  /* ==================== DOWNLOAD BUTTON ==================== */
  .download-bar {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    font-family: 'Inter', sans-serif;
  }

  .download-btn {
    background: #0a0a0a;
    color: #C8F23C;
    border: none;
    padding: 14px 22px;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 12pt;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    border-left: 4px solid #C8F23C;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .download-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(0,0,0,0.32);
  }

  .download-hint {
    background: rgba(10,10,10,0.85);
    color: #fff;
    font-size: 10pt;
    padding: 6px 12px;
    max-width: 280px;
    line-height: 1.35;
    letter-spacing: 0.01em;
  }

  @media print {
    .download-bar { display: none !important; }
    body { background: #fff; }
    .sign { box-shadow: none; }
  }
</style>
</head>
<body>

<div class="download-bar">
  <button class="download-btn" onclick="window.print()">Save as PDF</button>
  <div class="download-hint">In the print dialog: <b>Destination → Save as PDF</b>, <b>Margins → None</b>, <b>Layout → Landscape</b>, <b>Paper size → Custom 14 × 11 in</b>.</div>
</div>

<div class="sign">

  <div class="stripe-top"></div>
  <div class="stripe-bottom"></div>

  <div class="est-pill">EST · 2002</div>

  <!-- LOGO (center, large) -->
  <div class="logo-wrap">
    <img src="images/logo-white.png" class="logo" alt="Coach Movers">
  </div>

  <!-- TAGLINE -->
  <div class="tagline">Moving Made <span class="accent">Easy.</span></div>
  <div class="tagline-rule"></div>

  <!-- BOTTOM CONTACT INFO -->
  <div class="contact">

    <div class="contact-item">
      <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
      </svg>
      <div>
        <div class="contact-label">Call</div>
        <div class="phone-value"><span class="area">(800)</span> 917-4446</div>
      </div>
    </div>

    <div class="contact-divider"></div>

    <div class="contact-item">
      <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
      <div>
        <div class="contact-label">Visit</div>
        <div class="address-value">
          200 Broadhollow Rd, Suite 207<br>
          <span class="address-city">Melville, NY 11747</span>
        </div>
      </div>
    </div>

  </div>

</div>
</body>
</html>
