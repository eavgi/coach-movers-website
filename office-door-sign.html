<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coach Movers — Office Door Sign (11×14 Acrylic)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  @page { size: 14in 11in; margin: 0; }

  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  :root {
    --lime: #C8F23C;
    --ink: #0a0a0a;
    --rule: #1a1a1a;
    --muted: #8a8a8a;
    --cream: #faf8f3;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #d8d8d8;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
  }

  /* ==================== SIGN ==================== */
  .sign {
    width: 14in;
    height: 11in;
    margin: 0 auto;
    background: #ffffff;
    overflow: hidden;
    position: relative;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    display: flex;
  }

  /* Subtle outer keyline that hints at the acrylic edge */
  .sign::before {
    content: '';
    position: absolute;
    inset: 0.22in;
    border: 1px solid #ececec;
    pointer-events: none;
    z-index: 6;
  }

  /* Top + bottom lime stripes */
  .stripe-top, .stripe-bottom {
    position: absolute;
    left: 0; right: 0;
    height: 0.14in;
    background: var(--ink);
    z-index: 7;
  }
  .stripe-top { top: 0; }
  .stripe-bottom { bottom: 0; }

  .stripe-top::after, .stripe-bottom::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 0.04in;
    background: var(--lime);
  }
  .stripe-top::after { bottom: 0; }
  .stripe-bottom::before { top: 0; }

  /* ==================== LEFT PANEL (logo) ==================== */
  .left {
    width: 6.4in;
    height: 100%;
    background: var(--ink);
    color: #fff;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 0.8in 0.6in;
    flex-shrink: 0;
  }

  /* Subtle radial accent in the dark panel */
  .left::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(200,242,60,0.06) 0%, rgba(200,242,60,0) 60%);
    pointer-events: none;
  }

  .est-pill {
    position: absolute;
    top: 0.6in;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 9.5pt;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--lime);
    border: 1px solid var(--lime);
    padding: 0.07in 0.28in;
    line-height: 1;
  }

  .logo-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    /* Logo is dark on transparent, so we invert it for the dark panel */
    filter: invert(1) brightness(1.05);
  }

  .logo {
    max-width: 4.6in;
    max-height: 4in;
    width: auto;
    height: auto;
    object-fit: contain;
  }

  .tagline {
    position: absolute;
    bottom: 0.85in;
    left: 0; right: 0;
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-style: italic;
    font-size: 22pt;
    color: #fff;
    letter-spacing: 0.005em;
  }
  .tagline .accent { color: var(--lime); }

  /* Vertical divider between panels */
  .left::after {
    content: '';
    position: absolute;
    top: 0.85in;
    bottom: 0.85in;
    right: 0;
    width: 1px;
    background: var(--lime);
    opacity: 0.35;
  }

  /* ==================== RIGHT PANEL (info) ==================== */
  .right {
    flex: 1;
    height: 100%;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0.9in 0.9in;
    position: relative;
  }

  .eyebrow {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 11pt;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 0.18in;
  }

  .headline {
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-style: italic;
    font-size: 44pt;
    line-height: 0.95;
    letter-spacing: -0.015em;
    color: var(--ink);
    margin: 0 0 0.12in;
  }

  .headline-rule {
    width: 1.1in;
    height: 3px;
    background: var(--lime);
    margin-bottom: 0.5in;
  }

  /* Info rows */
  .row {
    display: flex;
    align-items: flex-start;
    gap: 0.32in;
    padding: 0.32in 0;
    border-bottom: 1px solid #ececec;
  }
  .row:last-child { border-bottom: none; }

  .row-icon {
    width: 0.5in;
    height: 0.5in;
    flex-shrink: 0;
    color: var(--ink);
    margin-top: 0.05in;
  }

  .row-text { flex: 1; }

  .row-label {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 9.5pt;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 0.08in;
  }

  .phone-value {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 42pt;
    line-height: 1;
    letter-spacing: -0.005em;
    color: var(--ink);
    margin: 0;
  }
  .phone-value .area { color: #aaa; font-weight: 500; }

  .address-value {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 18pt;
    line-height: 1.3;
    letter-spacing: 0.02em;
    color: var(--ink);
    margin: 0;
  }
  .address-city {
    color: #888;
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  .web-value {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 18pt;
    line-height: 1;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
    margin: 0;
  }
  .web-value .dot { color: var(--lime); }

  /* ==================== DOWNLOAD BUTTON ==================== */
  .download-bar {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    font-family: 'Inter', sans-serif;
  }

  .download-btn {
    background: #0a0a0a;
    color: #C8F23C;
    border: none;
    padding: 14px 22px;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 12pt;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    border-left: 4px solid #C8F23C;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .download-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(0,0,0,0.32);
  }

  .download-hint {
    background: rgba(10,10,10,0.85);
    color: #fff;
    font-size: 10pt;
    padding: 6px 12px;
    max-width: 280px;
    line-height: 1.35;
    letter-spacing: 0.01em;
  }

  @media print {
    .download-bar { display: none !important; }
    body { background: #fff; }
    .sign { box-shadow: none; }
  }
</style>
</head>
<body>

<div class="download-bar">
  <button class="download-btn" onclick="window.print()">Save as PDF</button>
  <div class="download-hint">In the print dialog: <b>Destination → Save as PDF</b>, <b>Margins → None</b>, <b>Layout → Landscape</b>, <b>Paper size → Custom 14 × 11 in</b>.</div>
</div>

<div class="sign">

  <div class="stripe-top"></div>
  <div class="stripe-bottom"></div>

  <!-- LEFT PANEL: LOGO -->
  <div class="left">
    <div class="est-pill">EST · 2002</div>
    <div class="logo-wrap">
      <img src="images/logo.png" class="logo" alt="Coach Movers">
    </div>
    <div class="tagline">Moving Made <span class="accent">Easy.</span></div>
  </div>

  <!-- RIGHT PANEL: INFO -->
  <div class="right">

    <div class="eyebrow">Coach Movers · Office</div>
    <h1 class="headline">Come on in.</h1>
    <div class="headline-rule"></div>

    <!-- PHONE -->
    <div class="row">
      <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
      </svg>
      <div class="row-text">
        <div class="row-label">Call</div>
        <div class="phone-value"><span class="area">(800)</span> 917-4446</div>
      </div>
    </div>

    <!-- ADDRESS -->
    <div class="row">
      <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
      <div class="row-text">
        <div class="row-label">Visit</div>
        <div class="address-value">
          200 Broadhollow Rd, Suite 207<br>
          <span class="address-city">Melville, NY 11747</span>
        </div>
      </div>
    </div>

    <!-- WEB -->
    <div class="row">
      <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
      </svg>
      <div class="row-text">
        <div class="row-label">Online</div>
        <div class="web-value">CoachMovers<span class="dot">.</span>com</div>
      </div>
    </div>

  </div>

</div>
</body>
</html>
