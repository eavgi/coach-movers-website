      )
    ),
    e("div", { style: { position: "absolute", top: 178, left: MARGIN, right: MARGIN, bottom: 78 }},
      e(Eyebrow, null, "Secure Storage for Home Sellers"),
      e("h1", { style: { fontSize: 30, lineHeight: 1.05, fontWeight: 800, color: T.ink, margin: "8px 0 0 0", letterSpacing: -1 }},
        "Selling Your Home?", e("br"),
        e("span", { style: { color: T.lime }}, "We've Got Your Storage.")),
      e("p", { style: { fontSize: 12, color: T.muted, margin: "8px 0 0 0", lineHeight: 1.5 }},
        "Closing dates don't always align. We bridge the gap."),
      e("div", { style: { marginTop: 12, display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 12px", background: T.ink, borderRadius: 8 }},
        ...flow.flatMap(function(f,i){
          var node = e("div", { key: "n"+i, style: { textAlign: "center" }},
            e("div", { style: { width: 22, height: 22, borderRadius: "50%", background: T.lime, color: T.ink, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 900, margin: "0 auto", lineHeight: 1 }}, f[0]),
            e("div", { style: { fontSize: 9, color: "#fff", fontWeight: 700, marginTop: 4 }}, f[1])
          );
          if (i === flow.length - 1) return [node];
          var sep = e("div", { key: "s"+i, style: { flex: 1, height: 1, background: "rgba(184,240,38,0.4)", margin: "0 6px", marginTop: -12 }});
          return [node, sep];
        })
      ),
      e("div", { style: { fontSize: 15, fontWeight: 800, color: T.ink, marginTop: 12 }}, "Why Trust Coach Movers"),
      e("div", { style: { marginTop: 4 }},
        ...trust.map(function(tr,i){ return e("div", { key: i, style: { display: "flex", gap: 10, alignItems: "flex-start", padding: "5px 0", borderBottom: i<trust.length-1 ? "1px solid " + T.hairline : "none" }},
          e(Check, { size: 14 }),
          e("div", null,
            e("div", { style: { fontSize: 11.5, fontWeight: 800, color: T.ink, lineHeight: 1.2 }}, tr[0]),
            e("div", { style: { fontSize: 10, color: T.muted, marginTop: 2, lineHeight: 1.4 }}, tr[1])
          )
        ); })
      ),
      e("div", { style: { marginTop: 12, background: T.lime, borderRadius: 8, padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" }},
        e("div", null,
          e("div", { style: { fontSize: 16, fontWeight: 900, color: T.ink, letterSpacing: -0.4 }}, "Get Your Free Quote"),
          e("div", { style: { fontSize: 11, fontWeight: 700, color: T.ink, marginTop: 3 }}, BIZ.email),
          e("div", { style: { fontSize: 10.5, color: T.ink, opacity: 0.8, marginTop: 4 }}, "Call " + BIZ.phone)
        ),
        e("div", { style: { width: 52, height: 52, background: T.ink, borderRadius: 6, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }},
          e("div", { style: { width: 38, height: 38, background: "repeating-linear-gradient(45deg,#fff 0 3px,transparent 3px 6px),repeating-linear-gradient(-45deg,#fff 0 3px,transparent 3px 6px)" }})
        )
      )
    ),
    e(BottomBar, { cta: "Coach Movers · Trusted Since 2002" })
  );
}

const REDESIGNED_PAGES = [CoverPage, DifferencePage, ServicesPage, IncludedFreePage, ProtectionPage, ProcessPage, TestimonialsPage, BackCoverPage];

function RedesignedPage(p) {
  var w = p.width;
  var h = w * PAGE_H / PAGE_W;
  var Comp = REDESIGNED_PAGES[p.idx];
  return e("div", { style: { width: w, height: h, overflow: "hidden", background: "#fff", position: "relative" }},
    e("div", { style: { width: PAGE_W, height: PAGE_H, transform: "scale(" + (w/PAGE_W) + ")", transformOrigin: "top left", position: "absolute", top: 0, left: 0 }},
      Comp ? e(Comp) : null
    )
  );
}

function App() {
  const [spread, setSpread] = React.useState(0);
  const [flipping, setFlipping] = React.useState(false);
  const [zoom, setZoom] = React.useState(null);
  const [version, setVersion] = React.useState("redesigned");
  const [vw, setVW] = React.useState(typeof window !== 'undefined' ? window.innerWidth : 1280);
  React.useEffect(() => {
    const r = () => setVW(window.innerWidth);
    window.addEventListener('resize', r);
    return () => window.removeEventListener('resize', r);
  }, []);
  const max = 4;

  function go(dir) {
    if (flipping) return;
    const next = spread + dir;
    if (next < 0 || next > max) return;
    setFlipping(true);
    setTimeout(() => { setSpread(next); setFlipping(false); }, 300);
  }

  // Keyboard nav
  React.useEffect(() => {
    function onKey(ev) {
      if (ev.key === "ArrowLeft") go(-1);
      else if (ev.key === "ArrowRight") go(1);
      else if (ev.key === "Escape" && zoom !== null) setZoom(null);
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const getPages = (s) => s === 0 ? [0, null] : s === max ? [null, 7] : [s*2-1, s*2];
  const [li, ri] = getPages(spread);
  const isCover = spread === 0, isBack = spread === max;
  const naturalBookletW = (isCover || isBack ? PW : PW*2 + 6) + 48*2 + 20*2;
  const bookletScale = Math.min(1, Math.max(0.42, (vw - 24) / naturalBookletW));

  function NavBtn(props) {
    const dis = props.disabled;
    return e("button", {
      onClick: () => go(props.dir), disabled: dis,
      style: {
        width: 48, height: 48, borderRadius: "50%",
        background: dis ? "rgba(255,255,255,0.05)" : "rgba(184,240,38,0.12)",
        border: dis ? "1px solid rgba(255,255,255,0.08)" : "1px solid rgba(184,240,38,0.25)",
        color: dis ? "rgba(255,255,255,0.15)" : "#b8f026",
        cursor: dis ? "default" : "pointer",
        fontSize: 24, display: "flex", alignItems: "center", justifyContent: "center",
        transition: "all 0.2s", flexShrink: 0
      }
    }, props.dir < 0 ? "\u2039" : "\u203a");
  }

  // Clean page card — NO overlay on the image
  function PageCard(props) {
    return e("div", {
      onClick: () => setZoom(props.idx),
      style: {
        width: PW, height: PH, background: version === "original" ? "#1a1a1a" : "#fff", borderRadius: props.radius || "6px",
        overflow: "hidden", cursor: "zoom-in", position: "relative",
        transition: "opacity 0.3s", opacity: flipping ? 0.6 : 1
      }
    },
      version === "original"
        ? e("img", { src: PAGES[props.idx].src, alt: PAGES[props.idx].label,
            style: { width: "100%", height: "100%", objectFit: "cover", display: "block" } })
        : e(RedesignedPage, { idx: props.idx, width: PW })
    );
  }

  const spine = e("div", { style: { width: 6, height: PH, flexShrink: 0,
    background: "linear-gradient(180deg, #444, #1a1a1a, #444)",
    boxShadow: "inset 0 0 6px rgba(0,0,0,0.6)" }});

  const bookContent = (isCover || isBack)
    ? e(PageCard, { idx: isCover ? 0 : 7, radius: "6px" })
    : e(React.Fragment, null,
        e(PageCard, { idx: li, radius: "6px 0 0 6px" }),
        spine,
        e(PageCard, { idx: ri, radius: "0 6px 6px 0" })
      );

  // Page labels BELOW the booklet
  function getVisibleLabels() {
    if (isCover) return ["Page 1 \u00b7 " + PAGES[0].label];
    if (isBack) return ["Page 8 \u00b7 " + PAGES[7].label];
    return [
      "Page " + (li+1) + " \u00b7 " + PAGES[li].label,
      "Page " + (ri+1) + " \u00b7 " + PAGES[ri].label
    ];
  }
  const visLabels = getVisibleLabels();

  const dots = Array.from({length:5}).map((_, i) =>
    e("button", { key: i, onClick: () => !flipping && setSpread(i), style: {
      width: spread===i ? 28 : 8, height: 8, borderRadius: 4,
      background: spread===i ? "#b8f026" : "rgba(255,255,255,0.2)",
      border: "none", cursor: "pointer", transition: "all 0.3s"
    }})
  );

  const thumbs = PAGES.map((p, i) => {
    const active = i===li || i===ri || (isCover&&i===0) || (isBack&&i===7);
    return e("div", { key: i, onClick: () => {
      if(i===0) setSpread(0); else if(i===7) setSpread(4); else setSpread(Math.ceil(i/2));
    }, style: {
      width: 42, height: 65, borderRadius: 3, overflow: "hidden",
      border: active ? "2px solid #b8f026" : "2px solid transparent",
      opacity: active ? 1 : 0.4, cursor: "pointer", transition: "all 0.2s", flexShrink: 0
    }}, version === "original"
      ? e("img", { src: p.src, alt: p.label,
          style: { width: "100%", height: "100%", objectFit: "cover", display: "block" } })
      : e(RedesignedPage, { idx: i, width: 38 }));
  });

  // Zoom overlay
  const zoomEl = zoom !== null ? e("div", {
    onClick: () => setZoom(null),
    style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.94)", zIndex: 100,
      display: "flex", alignItems: "center", justifyContent: "center", cursor: "zoom-out" }
  },
    e("div", { style: { position: "relative" } },
      version === "original"
        ? e("img", { src: PAGES[zoom].src, alt: PAGES[zoom].label,
            style: { maxWidth: "92vw", maxHeight: "90vh", objectFit: "contain",
              borderRadius: 8, boxShadow: "0 0 80px rgba(184,240,38,0.12)" } })
        : e("div", { style: { borderRadius: 8, overflow: "hidden", boxShadow: "0 0 80px rgba(184,240,38,0.12)" }},
            e(RedesignedPage, { idx: zoom, width: Math.min(window.innerWidth * 0.92, window.innerHeight * 0.9 * PAGE_W / PAGE_H) })
          ),
      e("div", { style: { marginTop: 14, textAlign: "center", color: "rgba(255,255,255,0.5)", fontSize: 13 }
      }, "Page " + (zoom+1) + " \u00b7 " + PAGES[zoom].label + " \u2014 click to close"),
      zoom > 0 ? e("button", { onClick: (ev) => { ev.stopPropagation(); setZoom(zoom-1); },
        style: { position: "absolute", left: -56, top: "50%", transform: "translateY(-50%)",
          width: 44, height: 44, borderRadius: "50%",
          background: "rgba(184,240,38,0.12)", border: "1px solid rgba(184,240,38,0.25)",
          color: "#b8f026", fontSize: 22, cursor: "pointer",
          display: "flex", alignItems: "center", justifyContent: "center" }
      }, "\u2039") : null,
      zoom < 7 ? e("button", { onClick: (ev) => { ev.stopPropagation(); setZoom(zoom+1); },
        style: { position: "absolute", right: -56, top: "50%", transform: "translateY(-50%)",
          width: 44, height: 44, borderRadius: "50%",
          background: "rgba(184,240,38,0.12)", border: "1px solid rgba(184,240,38,0.25)",
          color: "#b8f026", fontSize: 22, cursor: "pointer",
          display: "flex", alignItems: "center", justifyContent: "center" }
      }, "\u203a") : null
    )
  ) : null;

  return e("div", { style: {
    minHeight: "100vh",
    background: "linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)",
    display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
    padding: "24px 20px", userSelect: "none", position: "relative", overflow: "hidden"
  }},
    // Subtle bg pattern
    e("div", { style: { position: "absolute", inset: 0, opacity: 0.03,
      backgroundImage: "radial-gradient(circle, #fff 1px, transparent 1px)",
      backgroundSize: "24px 24px" }}),

    // Title
    e("div", { style: { textAlign: "center", marginBottom: 20, zIndex: 1 }},
      e("div", { style: { color: "#b8f026", fontSize: 11, fontWeight: 600, letterSpacing: 3, marginBottom: 4 }}, "COACH MOVERS"),
      e("div", { style: { color: "#fff", fontSize: 24, fontWeight: 700 }}, "Booklet Preview"),
      e("div", { style: { color: "rgba(255,255,255,0.35)", fontSize: 12, marginTop: 3 }}, '5.5" \u00d7 8.5" \u00b7 8 Pages'),
      e("div", { style: { marginTop: 12, display: "inline-flex", padding: 4, background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 999 }},
        e("button", { onClick: () => setVersion("redesigned"),
          style: { padding: "7px 18px", borderRadius: 999, border: "none", cursor: "pointer",
            background: version === "redesigned" ? "#b8f026" : "transparent",
            color: version === "redesigned" ? "#0a0a0a" : "rgba(255,255,255,0.6)",
            fontSize: 11, fontWeight: 700, letterSpacing: 1.2, textTransform: "uppercase", transition: "all 0.2s" }
        }, "Redesigned"),
        e("button", { onClick: () => setVersion("original"),
          style: { padding: "7px 18px", borderRadius: 999, border: "none", cursor: "pointer",
            background: version === "original" ? "#b8f026" : "transparent",
            color: version === "original" ? "#0a0a0a" : "rgba(255,255,255,0.6)",
            fontSize: 11, fontWeight: 700, letterSpacing: 1.2, textTransform: "uppercase", transition: "all 0.2s" }
        }, "Original")
      )
    ),

    // Booklet row (scales to fit narrow viewports)
    e("div", { style: { width: naturalBookletW*bookletScale, height: PH*bookletScale, zIndex: 1 }},
      e("div", { style: { transform: "scale(" + bookletScale + ")", transformOrigin: "top left", display: "flex", alignItems: "center", gap: 20, width: naturalBookletW, height: PH }},
        e(NavBtn, { dir: -1, disabled: spread===0||flipping }),
        e("div", { style: { display: "flex", filter: "drop-shadow(0 24px 48px rgba(0,0,0,0.55))" }}, bookContent),
        e(NavBtn, { dir: 1, disabled: spread===max||flipping })
      )
    ),

    // Page labels BELOW the booklet (not overlaying)
    e("div", { style: { marginTop: 12, display: "flex", gap: 40, justifyContent: "center", zIndex: 1, flexWrap: "wrap", padding: "0 16px", textAlign: "center" }},
      ...visLabels.map((lbl, i) => e("div", { key: i, style: {
        color: "rgba(255,255,255,0.45)", fontSize: 12, fontWeight: 500
      }}, lbl))
    ),

    // Spread label + dots
    e("div", { style: { marginTop: 16, textAlign: "center", zIndex: 1 }},
      e("div", { style: { color: "rgba(255,255,255,0.4)", fontSize: 12, marginBottom: 8 }}, SPREAD_LABELS[spread]),
      e("div", { style: { display: "flex", gap: 6, justifyContent: "center" }}, ...dots)
    ),

    // Thumbnails
    e("div", { style: { display: "flex", gap: 6, marginTop: 18, zIndex: 1, maxWidth: "100%", overflowX: "auto", padding: "4px 12px", justifyContent: vw < 420 ? "flex-start" : "center" }}, ...thumbs),

    zoomEl
  );
}

ReactDOM.render(e(App), document.getElementById("root"));
  </script>
</body>
</html>
